<!-- public/offline.html -->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión — Inspecciones</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        margin: 0;
      }
      main {
        text-align: center;
        padding: 2rem;
        max-width: 28rem;
      }
      h1 {
        font-size: 1.6rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #475569;
        margin: 0 0 1.5rem;
      }
      a {
        color: #dc2626;
        font-weight: 600;
      }
      .offline-box {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 1.5rem;
      }
    </style>
  </head>
  <body>
    <main class="offline-box">
      <h1>Estás sin conexión</h1>
      <p>
        La información que ya habías visitado sigue disponible, pero no se pueden
        cargar datos nuevos. Revisa tu conexión e inténtalo de nuevo.
      </p>
      <a href="/">Reintentar</a>
    </main>
  </body>
</html>
