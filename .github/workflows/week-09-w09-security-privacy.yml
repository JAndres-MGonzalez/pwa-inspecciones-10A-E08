# Comprobaciones formativas del kit, con reporte técnico del proyecto.
name: Week 09 — w09-security-privacy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: npm
      - name: Setup 1
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
      - name: AC-01 — Instalación limpia y build
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json && (test -f package-lock.json || test -f pnpm-lock.yaml || test -f yarn.lock) && npm run build --if-present
      - name: AC-02 — Artefactos del kit
        shell: bash
        run: |
          set -euo pipefail
          test -e 'docs/threat-model.md' && test -e 'docs/privacy-data-inventory.md' && test -e 'src/lib/security/' && test -e 'tests/security.spec.ts' && test -e 'public/robots.txt'
      - name: AC-03 — Suite ejecutable
        shell: bash
        run: |
          set -euo pipefail
          test -d tests && find tests -type f -print -quit | grep -q . && npm run test --if-present -- --run
      - name: AC-04 — Verificación y evidencia
        run: |
          test -s README.md && test -s evidence/individual.md
          npm run verify
          bash public-tests/check.sh
      - name: Reporte del SHA comprobado
        if: always()
        run: node scripts/evaluation-result.mjs
      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-evidence-w09-security-privacy
          if-no-files-found: error
          path: |
            evaluation-result.json
            reports/
