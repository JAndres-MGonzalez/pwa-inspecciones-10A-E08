# Semana 3: feedback automático de service worker y offline
name: week-03-w03-service-worker-offline

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: npm
      - name: ci
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: build
        run: npm run build --if-present
      - name: test
        run: npm run test --if-present -- --run
      - name: evaluate
        if: always()
        run: npm run test:feedback 2>/dev/null || true
      - name: copy-artifacts
        if: always()
        run: |
          cp -f .evaluation/*.json evaluation-results/ 2>/dev/null || true
          cp -f .evaluation/*.json evaluation-results.json 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-result.json
          path: evaluation-result.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
