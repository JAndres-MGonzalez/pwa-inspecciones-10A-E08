# Semana 5: feedback automático de w05-sync-data
#
# Basado en el workflow del kit de la actividad, con dos correcciones documentadas
# en public-tests/README.md:
#
#   1. El checkout fija `ref:` al SHA del PR. Sin esto, en un evento `pull_request`
#      actions/checkout deja el SHA del commit de fusión sintético, y las
#      comprobaciones de este repo validan `report.commitSha` contra
#      `git rev-parse HEAD`: el reporte describiría un commit que nadie commiteó.
#   2. AC-02 es progresivo mientras la semana está en curso (ver abajo).
name: week-05-w05-sync-data

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Poner en 'true' el día de integrar (sábado) para que AC-02 vuelva a exigir los
  # cinco artefactos. Mientras siga en 'false', AC-02 exige solo el contrato y la
  # política, que son lo único que existe el lunes; exigir los tres bloques de los
  # compañeros el lunes dejaría master en rojo y los tres trabajarían sobre una base
  # que no pasa. En la entrega los cinco están exigidos.
  W05_ENTREGABLES_COMPLETOS: 'false'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 4

      - name: Setup
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: AC-01 - Instalación limpia y build completan.
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json && (test -f package-lock.json || test -f pnpm-lock.yaml || test -f yarn.lock) && npm run build --if-present

      - name: AC-02 - Los artefactos declarados para la actividad existen.
        shell: bash
        env:
          COMPLETOS: ${{ env.W05_ENTREGABLES_COMPLETOS }}
        run: |
          set -euo pipefail
          # El contrato compartido y la política nacen en el arranque de la semana.
          test -s 'src/lib/storage/schema.ts'
          test -s 'docs/sync-policy.md'
          for doc in docs/sync/01-modelo.md docs/sync/02-conflictos.md docs/sync/03-cola.md; do
            test -s "$doc"
          done
          if [ "$COMPLETOS" = "true" ]; then
            test -s 'src/lib/sync/queue.ts'
            test -s 'src/lib/sync/conflict-policy.ts'
            test -s 'tests/sync.spec.ts'
            echo "AC-02: los cinco artefactos de la semana estan presentes."
          else
            echo "AC-02: contrato y politica presentes. Los bloques B y C siguen abiertos;"
            echo "       se exigiran al integrar con W05_ENTREGABLES_COMPLETOS=true."
          fi

      - name: AC-03 - Existe una suite ejecutable de pruebas.
        shell: bash
        run: |
          set -euo pipefail
          test -d tests && find tests -type f -name '*.spec.*' -print -quit | grep -q . && npm run test --if-present -- --run

      - name: Verificación local y chequeo público
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify.mjs
          bash public-tests/check.sh

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-evidence-w05-sync-data
          if-no-files-found: ignore
          path: |
            evaluation-result.json
            coverage/
            test-results/
